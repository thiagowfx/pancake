# See https://prek.j178.dev for more information
# Migrated from pre-commit to prek: https://prek.j178.dev/benchmark/
#
# Install prek itself:
#   $ cargo install prek
#     OR
#   $ brew install prek
#
# Update all prek hooks to latest version:
#   $ prek update
#
# Install all default prek hooks locally:
#   $ prek install
#
# Apply a given prek hook to all files:
#   $ prek run --all-files <id>
#
# Apply all prek hooks to all files:
#   $ prek run --all-files
ci:
  autoupdate_schedule: monthly
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # keep-sorted start
      - id: check-executables-have-shebangs
      - id: check-yaml
      - id: detect-private-key
      - id: trailing-whitespace
      # keep-sorted end
  - repo: https://github.com/rhysd/actionlint/
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/golangci/misspell
    rev: b565578a5ec9b815331bdae8f588021f7696ec6f  # frozen: v0.8.0
    hooks:
      - id: misspell
  - repo: https://github.com/google/keep-sorted
    rev: b225c42a9a8f480d760cf967d1e3a839060b242c  # frozen: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/zimbatm/mdsh
    rev: 4b8fb1e7b52a65d6ea875ede3272ac3571f5d015 # frozen: v0.9.2
    hooks:
      - id: mdsh
        files: ^README.md$
  - repo: https://github.com/thiagowfx/pre-commit-hooks/
    rev: cbd85e45246586c8869439c8b7bcc38073204bd9  # frozen: v0.0.23
    hooks:
      - id: check-bash-shebang
        types:
          - shell
